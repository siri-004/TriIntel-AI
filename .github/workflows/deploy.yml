name: Deploy TriIntel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  register-production:
    name: Register Production Deployment
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://triintel-ai.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment successful
        run: |
          echo "========================================"
          echo "  TriIntel is live on Vercel + Render  "
          echo "========================================"
          echo "Frontend : https://tri-intel-ai.vercel.app/"
          echo "Backend  :  https://triintel-ai.onrender.com"
          echo "Status   : production"
          echo "========================================"